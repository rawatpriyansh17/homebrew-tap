name: Update formula
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-formula
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published formula
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag=$(gh api repos/rawatpriyansh17/typedef/releases/latest --jq .tag_name)
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          download_dir=$(mktemp -d)
          trap 'rm -rf "$download_dir"' EXIT
          gh release download "$release_tag" --repo rawatpriyansh17/typedef --pattern typedef.rb --pattern typedef.rb.sha256 --dir "$download_dir"
          (cd "$download_dir" && sha256sum --check typedef.rb.sha256)
          ruby -c "$download_dir/typedef.rb"
          cp "$download_dir/typedef.rb" Formula/typedef.rb
          if ! git diff --quiet -- Formula/typedef.rb; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Formula/typedef.rb
            git commit -m "Update typedef to $release_tag"
            git push
          fi
